<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>

    <!-- Cutlery Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.45" />
    </filter>

    <!-- Cutlery Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="120" fill="url(#glow)" />
  
  <!-- Subtle Border Highlight -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-opacity="0.3" />

  <!-- Cutlery Group -->
  <g filter="url(#dropShadow)" fill="url(#silverGrad)">
    
    <!-- FORK (Left, tilted right) -->
    <g transform="translate(256, 256) rotate(-28) translate(-256, -256)">
      <!-- Fork Prongs and Head -->
      <path d="M 215 110 
               C 215 175, 235 210, 250 225 
               L 250 380 
               C 250 395, 262 405, 270 405 
               C 278 405, 290 395, 290 380 
               L 290 225 
               C 305 210, 325 175, 325 110 
               C 310 110, 305 135, 300 160 
               C 295 135, 290 110, 278 110 
               C 266 110, 262 135, 258 160 
               C 254 135, 250 110, 238 110 
               C 226 110, 222 135, 218 160 
               C 216 135, 215 110, 215 110 Z" />
    </g>

    <!-- KNIFE (Right, tilted left) -->
    <g transform="translate(256, 256) rotate(28) translate(-256, -256)">
      <!-- Knife Blade and Handle -->
      <path d="M 245 105 
               C 270 115, 290 145, 290 200 
               C 290 225, 275 240, 265 248 
               L 265 380 
               C 265 395, 255 405, 245 405 
               C 235 405, 225 395, 225 380 
               L 225 115 
               C 225 108, 235 102, 245 105 Z" />
    </g>

  </g>

  <!-- Little Warm Star Accent -->
  <path d="M 256 65 L 261 78 L 274 83 L 261 88 L 256 101 L 251 88 L 238 83 L 251 78 Z" fill="#fef08a" opacity="0.9" />
</svg>